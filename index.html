<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的美食地圖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>我的美食地圖</h1>
        </header>

        <section class="food-map">
            <div class="food-item">
                <h2>燒肉店</h2>
                <img src="beef.jpg" alt="燒肉店圖片">
                <p>這家燒肉店提供多種美味的燒肉選擇，搭配自家特製醬料，讓每一口都充滿驚喜。</p>
                <a href="https://www.google.com/maps/place/燒肉店地址" target="_blank">查看位置</a>
            </div>
            <div class="food-item">
                <h2>小籠包</h2>
                <img src="xiaolongbao.jpg" alt="小籠包圖片">
                <p>這家小籠包店的湯汁鮮美，皮薄餡多，吃一口立刻讓人想再來一籠。</p>
                <a href="https://www.google.com/maps/place/小籠包店地址" target="_blank">查看位置</a>
            </div>
            <div class="food-item">
                <h2>魯肉飯</h2>
                <img src="lurosubao.jpg" alt="魯肉飯圖片">
                <p>經典的魯肉飯，搭配燙青菜，簡單卻滿足。香味撲鼻，讓人回味無窮。</p>
                <a href="https://www.google.com/maps/place/魯肉飯店地址" target="_blank">查看位置</a>
            </div>
        </section>
    </div>

</body>
</html>
